spring.application.name=event

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:some-super-duper-long-random-secret-key-temporary-for-now}
jwt.expiration=3600000

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Email
email.resend.api-key=${RESEND_API_KEY:}
email.from=${EMAIL_FROM:}
disable.email=${DISABLE_EMAIL:true}
